const state = { group:"all", status:"all", q:"" };

function chips(el, key, opts, st = state, cb = () => render()){
  el.innerHTML = opts.map(([v,label]) =>
    `<button class="chip" data-v="${v}" aria-pressed="${st[key]===v}">${label}</button>`).join("");
  el.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    st[key] = b.dataset.v;
    el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c===b));
    cb();
  });
}

function stats(){
  const n = DATA.length, done = DATA.filter(d=>d.done).length;
  const core = DATA.filter(d=>d.g==="core").length;
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${n}</b><span>對標總數</span></div>
     <div class="stat"><b>${core}</b><span>核心對標</span></div>
     <div class="stat"><b>${n-done}</b><span>還沒做過</span></div>
     <div class="stat"><b>${done}</b><span>已做過</span></div>`;
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const q = state.q.trim();
  const items = DATA.filter(d =>
    (state.group==="all" || d.g===state.group) &&
    (state.status==="all" || (state.status==="done") === d.done) &&
    (!q || (d.title+d.note+d.week).includes(q)));
  const list = document.getElementById("list");
  list.innerHTML = Object.entries(GROUPS).map(([k,g]) => {
    const rows = items.filter(d=>d.g===k);
    if(!rows.length) return "";
    return `<section><h2>${g.name}</h2><p class="desc">${g.desc}｜${rows.length} 個</p>` +
      rows.map(d => `<article class="card">
        <div class="meta"><span class="week">${d.week}</span>
          <span class="status ${d.done?"done":"todo"}">${d.done?"已做":"未做"}</span></div>
        <h3>${esc(d.title)}</h3>
        ${d.note?`<p class="note">${esc(d.note)}</p>`:""}
        <a href="${d.url}" target="_blank" rel="noopener">看對標 →</a>
      </article>`).join("") + `</section>`;
  }).join("");
  document.getElementById("empty").style.display = items.length ? "none" : "block";
}

const astate = { tier:"all", q:"" };
function renderAccounts(){
  const q = astate.q.trim().toLowerCase();
  const items = ACCOUNTS.filter(a =>
    (astate.tier==="all" || String(a.tier)===astate.tier) &&
    (!q || (a.name+a.track+a.why).toLowerCase().includes(q)));
  document.getElementById("alist").innerHTML = [1,2,3].map(t => {
    const rows = items.filter(a=>a.tier===t);
    if(!rows.length) return "";
    return `<section><h2>${TIERS[t][0]}</h2><p class="desc">${TIERS[t][2]}｜${rows.length} 個</p>` +
      rows.map(a => `<article class="card">
        <div class="meta"><span class="tier ${TIERS[t][1]}">${TIERS[t][0]}</span>
          <span class="track">${esc(a.track)}</span>${a.fans?`<span class="fans">${a.fans} 粉</span>`:""}</div>
        <h3>${esc(a.name)}</h3>
        <p class="note">${esc(a.why)}</p>
        ${a.url?`<a href="${a.url}" target="_blank" rel="noopener">${a.url.includes("/p/")?"看代表貼文 →":"看帳號 →"}</a>`:""}
      </article>`).join("") + `</section>`;
  }).join("");
  document.getElementById("aempty").style.display = items.length ? "none" : "block";
}
chips(document.getElementById("tierFilter"), "tier",
  [["all","全部"],["1","★ 高頻"],["2","● 一般"],["3","？ 待確認"]], astate, renderAccounts);
document.getElementById("aq").addEventListener("input", e => { astate.q = e.target.value; renderAccounts(); });
renderAccounts();

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t===b));
  document.getElementById("postsView").classList.toggle("hidden", b.dataset.view!=="posts");
  document.getElementById("accountsView").classList.toggle("hidden", b.dataset.view!=="accounts");
});
